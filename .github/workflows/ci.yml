# CI de spm-pro: dos paquetes + los cuatro ejemplos del kit de arquitectura, un workflow.
#
# - `lint`: swift-format del toolchain, configuración en `.swift-format` (raíz), en modo
#   `--strict` y bloqueante. X-01 lo dejó con `continue-on-error` y sin `--strict` porque
#   la oleada 1 corría seis agentes en paralelo tocando Sources/Tests a la vez; X-02, con
#   todo mergeado y `swift format lint --strict` en 0 avisos, endurece el job.
# - `test`: matriz por paquete. Tres capas, de más barata a más cara:
#     1. `SWIFT_STRICT_WARNINGS=1 swift build --build-tests` — nivel 0 de warnings
#        (el gate vive en cada Package.swift; sin la variable el consumidor no lo hereda).
#     2. `swift test --parallel` en macOS (host).
#     3. `xcodebuild test` en iOS Simulator, con el simulador que exista en el runner
#        (detectado en un paso previo; los nombres cambian con cada Xcode).
# - `example`: matriz por ejemplo, uno por variante del kit de arquitectura (PRD-AF-07) —
#   `AppFoundation/Examples/{CounterApp,NotesApp,LoginApp,CatalogApp}` — cada uno la prueba
#   de que ambos paquetes (o solo AppFoundation, en CounterApp/NotesApp) se adoptan sin
#   fricción. Solo macOS/`swift test`: ninguno expone un producto de app, así que no hay
#   scheme de `xcodebuild test` que ejecutar. Sustituye al job único de
#   `Examples/IntegrationExample` (movido con `git mv` a `AppFoundation/Examples/LoginApp`).
# - `generator`: `Scripts/verify-generator.sh` reproduce la verificación real del
#   generador/linter en un paquete temporal FUERA del repo: las cuatro variantes de
#   `generate-feature` compilan y sus tests pasan, `ArchitectureLint` (build-tool plugin)
#   pasa limpio, una violación de R1 hace fallar el build con `[ArchLint.R1]`, y
#   `swift package archlint` pasa limpio sobre los cuatro ejemplos (son la referencia).
# - `corenetworking-example`: `CoreNetworking/Examples/APIClientApp`, el consumidor mínimo
#   sin AppFoundation — la prueba de que CoreNetworking se adopta solo.
# - `docs`: primero `Scripts/check-doc-snippets.sh` (los bloques ```swift en línea de
#   `Documentation.docc/`, marcados `<!-- snippet: <name> -->`, deben coincidir con
#   `Snippets/` — PRD-X-04: `@Snippet(path:)` no se resuelve en el primer `xcodebuild
#   docbuild` sobre DerivedData limpio), luego `xcodebuild docbuild` para los dos schemes
#   (`AppFoundation`, `CoreNetworking-Package`) en iOS Simulator y macOS — falla si DocC no
#   puede construir el catálogo (`Documentation.docc/`) o si hay avisos (enlaces
#   `<doc:...>` rotos, parámetros sin documentar).
# - `snippets`: `swift build` en cada paquete compila `Snippets/` junto con Sources/Tests
#   (SwiftPM los descubre como productos ejecutables automáticamente) — job explícito y
#   rápido para que un snippet roto falle solo, sin esperar a la matriz completa de `test`.
# - `dedup-check`: `Scripts/dedup-check.sh`. `check-doc-snippets.sh` y `verify-generator.sh`
#   existen por triplicado/duplicado (Scripts/, AppFoundation/Scripts/, CoreNetworking/
#   Scripts/) porque cada paquete necesita su propia copia real para sobrevivir al `subtree
#   split` que lo publica — un symlink no serviría. Este job falla si una copia que debe
#   coincidir con otra diverge en silencio (ya pasó con `verify-generator.sh`). Solo aquí,
#   no en el CI de cada paquete publicado: ese no ve las copias hermanas de los otros
#   paquetes, así que no podría comparar nada.
# - `archlint-self`: `archlint` sobre `Sources/AppFoundation` y `Snippets/`, con la
#   configuración de `AppFoundation/.archlint.yml` (que desactiva R1-R15 y deja SOLO R16).
#   Las reglas de capas describen la arquitectura de una app consumidora y no aplican al
#   paquete que define esas primitivas — sobre las fuentes propias dan diez falsos positivos
#   por construcción. R16 sí aplica igual: toda `class` no `nonisolated` necesita un `deinit
#   {}` explícito, porque sin él el compilador sintetiza uno AISLADO que pasa por el shim de
#   back-deploy que abortó en iOS 26.2. Hasta 1.2.4 nada lintaba las fuentes propias y se
#   habían colado dos: `PopGestureEnabler.ViewController` y `ResourceBundle.Finder`, más
#   cuatro en `Snippets/` (código que el consumidor copia de la documentación).
# - `lifecycle-contract-probe`: `AppFoundation/Scripts/verify-lifecycle-contract.sh` monta
#   una app real (`AppFoundation/Sources/LifecycleContractProbeApp/`, un ejecutable, no un
#   test — `swift test` no lo toca) con una `NavigationStack` en una ventana de verdad, y
#   verifica que `ScreenContainer` cancela el trabajo en vuelo de una pantalla SOLO al
#   eliminarla de la jerarquía, nunca al taparla con un push — la mitad del contrato de
#   AF-11 que `swift test` no puede cubrir (headless, sin ventana). Bloqueante: un run
#   real confirmó que `macos-15` da WindowServer para esto fuera de un target de UI tests
#   (ver la nota sobre el job, más abajo).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Versiones FIJAS, no un selector de «la más reciente»: ese resolvía a la Xcode 26.x más
  # NUEVA de la imagen, así que validaba una versión distinta de la que los README prometen
  # («Swift 6.2+ — Xcode 26 o el toolchain equivalente») y se movería sola el día que la
  # imagen incorpore una Xcode mayor, sin que nadie lo decidiera.
  #
  # Comprobado el 2026-09-16 con
  #   gh api repos/actions/runner-images/contents/images/macos/<imagen>-Readme.md
  # qué ofrece cada imagen alojada:
  #   macos-15 → 16.3 … 26.0.1, 26.1.1, 26.2, 26.3
  #   macos-26 → 26.0.1 … 26.6   (también trae 26.0.1)
  #   xcode-27 → 27.0 beta 6 (27A5252f), en preview
  # El job del mínimo vive en macos-15 solo porque es donde corre el resto de la matriz: las
  # dos imágenes traen 26.0.1, así que migrar a macos-26 no costaría el job del mínimo.
  # (Corregido el 2026-09-16: una lectura truncada de esa tabla dio pie a afirmar que
  # macos-26 ya no traía 26.0.x. Sí la trae.)
  #
  # Al subir cualquiera de las dos, rehacer esa comprobación y actualizar la fecha.
  XCODE_MINIMO: "26.0.1"        # compila la librería: el contrato con quien consume
  XCODE_TESTS_MINIMO: "26.2"    # la más baja donde corren las suites (ver su job)
  XCODE_ACTUAL: "26.3"

jobs:
  lint:
    name: swift format lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_ACTUAL }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version
          swift format --version

      - name: swift format lint --strict
        run: |
          swift format lint --strict --recursive \
            AppFoundation/Sources AppFoundation/Tests AppFoundation/Examples AppFoundation/Plugins AppFoundation/Snippets \
            CoreNetworking/Sources CoreNetworking/Tests CoreNetworking/Examples CoreNetworking/Snippets

  test:
    name: ${{ matrix.package }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: AppFoundation
            # Mismo caso que CoreNetworking: con varios productos, el scheme que Xcode
            # genera con el NOMBRE DEL PAQUETE cubre solo la librería y NO trae acción de
            # test (`xcodebuild test` falla con "Scheme AppFoundation is not currently
            # configured for the test action", exit 66). El agregado que sí la trae es
            # `AppFoundation-Package` — el que lista `xcodebuild -list`.
            scheme: AppFoundation-Package
          - package: CoreNetworking
            # Con dos productos SPM no genera un scheme `CoreNetworking` con acción de
            # test: el agregado es `CoreNetworking-Package` (ver README del paquete).
            scheme: CoreNetworking-Package
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_ACTUAL }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Detectar simulador iOS disponible
        id: sim
        run: |
          # iPhone disponible del runtime iOS más reciente, prefiriendo el modelo base
          # ("iPhone 17" antes que "iPhone 17 Pro Max"). Se exporta el nombre, no el
          # UDID, para que el log de xcodebuild sea legible.
          name=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(rt for rt in devices if "iOS" in rt)
          for rt in reversed(runtimes):
              iphones = sorted((d["name"] for d in devices[rt] if d["name"].startswith("iPhone")), key=len)
              if iphones:
                  print(iphones[0]); break
          ')
          if [ -z "$name" ]; then
            echo "::error::No hay ningún iPhone disponible en el runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulador: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Cache de .build
        uses: actions/cache@v4
        with:
          path: ${{ matrix.package }}/.build
          key: spm-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles(format('{0}/Package.swift', matrix.package)) }}
          restore-keys: |
            spm-${{ matrix.package }}-${{ runner.os }}-

      - name: Build estricto (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build --build-tests

      - name: swift test (macOS)
        run: swift test --parallel

      - name: xcodebuild test (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "${{ matrix.scheme }}" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath "TestResults-${{ matrix.package }}.xcresult" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "xcodebuild-${{ matrix.package }}.log"

      - name: Subir resultados si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.package }}
          path: |
            ${{ matrix.package }}/TestResults-${{ matrix.package }}.xcresult
            ${{ matrix.package }}/xcodebuild-${{ matrix.package }}.log
          if-no-files-found: ignore

  example:
    name: Examples/${{ matrix.example }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        example: [CounterApp, NotesApp, LoginApp, CatalogApp]
    defaults:
      run:
        working-directory: AppFoundation/Examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_ACTUAL }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Cache de .build
        uses: actions/cache@v4
        with:
          path: AppFoundation/Examples/${{ matrix.example }}/.build
          key: spm-${{ matrix.example }}-${{ runner.os }}-${{ hashFiles(format('AppFoundation/Examples/{0}/Package.swift', matrix.example), 'AppFoundation/Package.swift', 'CoreNetworking/Package.swift') }}
          restore-keys: |
            spm-${{ matrix.example }}-${{ runner.os }}-

      - name: Build estricto (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build --build-tests

      - name: swift test (macOS)
        run: swift test --parallel

  generator:
    name: generate-feature + ArchitectureLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_ACTUAL }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Scripts/verify-generator.sh
        run: Scripts/verify-generator.sh

  corenetworking-example:
    name: Examples/APIClientApp
    runs-on: macos-15
    defaults:
      run:
        working-directory: CoreNetworking/Examples/APIClientApp
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_ACTUAL }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Cache de .build
        uses: actions/cache@v4
        with:
          path: CoreNetworking/Examples/APIClientApp/.build
          key: spm-APIClientApp-${{ runner.os }}-${{ hashFiles('CoreNetworking/Examples/APIClientApp/Package.swift', 'CoreNetworking/Package.swift') }}
          restore-keys: |
            spm-APIClientApp-${{ runner.os }}-

      - name: Build estricto (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build --build-tests

      - name: swift test (macOS)
        run: swift test --parallel

  docs:
    name: docbuild (${{ matrix.scheme }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: AppFoundation
            scheme: AppFoundation
          - package: CoreNetworking
            scheme: CoreNetworking-Package
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_ACTUAL }}

      - name: Scripts/check-doc-snippets.sh
        working-directory: ${{ github.workspace }}
        run: Scripts/check-doc-snippets.sh

      - name: xcodebuild docbuild (DerivedData limpio, 0 warnings)
        run: |
          set -o pipefail
          for destination in 'generic/platform=iOS Simulator' 'platform=macOS'; do
            echo "::group::docbuild -scheme ${{ matrix.scheme }} -destination $destination"
            log="$(mktemp)"
            xcodebuild docbuild \
              -scheme "${{ matrix.scheme }}" \
              -destination "$destination" \
              -derivedDataPath "$(mktemp -d)" \
              | tee "$log"
            echo "::endgroup::"
            if grep -q "warning:" "$log"; then
              echo "::error::docbuild (-destination $destination) produjo warnings"
              exit 1
            fi
          done

  snippets:
    name: Snippets/ (${{ matrix.package }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [AppFoundation, CoreNetworking]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_ACTUAL }}

      - name: swift build (compila Sources/Tests y Snippets/)
        run: swift build

  dedup-check:
    name: Scripts duplicados entre paquetes siguen sincronizados
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Scripts/dedup-check.sh
        run: Scripts/dedup-check.sh

  archlint-self:
    name: archlint (R16) sobre las fuentes de AppFoundation
    runs-on: macos-15
    defaults:
      run:
        working-directory: AppFoundation
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_ACTUAL }}

      - name: Construir archlint
        run: swift build --product archlint

      - name: archlint sobre Sources/ y Snippets/
        run: .build/debug/archlint --root . Sources/AppFoundation Snippets

  # PRD (verificación del contrato de cancelación de ScreenContainer, sept. 2026): igual que
  # el `lifecycle-contract-probe` de AppFoundation/.github/workflows/ci.yml (el CI del
  # repositorio publicado) — mismo script. Ver el encabezado de
  # AppFoundation/Scripts/verify-lifecycle-contract.sh.
  # Confirmado en un run real (AppFoundation, 306d677, 2026-09-05): los runners `macos-15`
  # SÍ dan WindowServer a una app con ventana que no es un target de UI tests. El job pasó
  # por el motivo correcto — el log trae la secuencia completa, incluida la aserción de que
  # B NO se cancela mientras está tapada — así que bloquea de verdad, sin `continue-on-error`.
  # Un gate que no puede fallar no es un gate.
  lifecycle-contract-probe:
    name: AppFoundation — ScreenContainer cancela solo al eliminar, nunca al tapar
    runs-on: macos-15
    defaults:
      run:
        working-directory: AppFoundation
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_ACTUAL }}

      - run: Scripts/verify-lifecycle-contract.sh

  # El contrato publicado en los README es «Swift 6.2+ — Xcode 26 o el toolchain
  # equivalente». El resto de la matriz corre con XCODE_ACTUAL, que lo satisface pero NO lo
  # comprueba: si algo dejara de compilar con la 26.0, nadie se enteraría hasta que lo
  # reportara quien consume. Este job es quien sostiene esa promesa, y por eso bloquea.
  minimo-soportado:
    name: Mínimo soportado — Xcode 26.0.1 (${{ matrix.package }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: AppFoundation
            scheme: AppFoundation-Package
          - package: CoreNetworking
            scheme: CoreNetworking-Package
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_MINIMO }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      # `swift build` a secas, SIN `--build-tests`, y es deliberado: lo que el contrato
      # promete a quien consume es que la LIBRERÍA compile con el mínimo, y eso es lo que
      # aquí se comprueba. Las suites de test no compilan ni corren en 26.0.1 —medido en el
      # run 35127837096 el 2026-09-16— y se ejecutan en el job `tests-minimo-ejecutable`.
      - name: Build estricto de la librería para macOS (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build

      # Y para iOS, que es donde vive la mitad interesante. `swift build` compila para el
      # HOST: los bloques `#if os(iOS)` —PopGestureEnabler entero, y trozos de
      # ScreenContainer, CustomNavigationBar, CoordinatorView— se parsean pero NO se
      # type-checkean. Sin este paso, el job decía comprobar el mínimo de una librería de
      # iOS sin compilar nunca su código de iOS. Hallazgo del revisor, 2026-09-16.
      #
      # `build` y no `build-for-testing`: las pruebas no compilan en el mínimo, y aquí lo
      # que se comprueba es la librería. No necesita simulador arrancado.
      - name: Build de la librería para iOS (0 warnings)
        run: |
          set -o pipefail
          xcodebuild build -scheme ${{ matrix.scheme }} \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES CODE_SIGNING_ALLOWED=NO -quiet

  # Las suites de test necesitan MÁS que el mínimo publicado, y por dos causas distintas
  # medidas en CI el 2026-09-16 (runs 35127837096 y 35134647002):
  #
  #   - CoreNetworking usa *exit tests* de swift-testing en cuatro sitios
  #     (NetworkingConfigurationTests ×3, PinningTests ×1). Hasta 26.1.1 esa facilidad no
  #     está implementada: `Testing/ExitTest.swift:398: Fatal error: Unimplemented`.
  #   - AppFoundation usa `weak let` en ViewModelOwnershipTests:99 y :127, que hasta 26.1.1
  #     el compilador rechaza con «'weak' must be a mutable variable».
  #
  # Medido: 26.0.1 → no; 26.1.1 → no (las dos causas siguen); 26.2 → SÍ, los dos paquetes.
  # De ahí XCODE_TESTS_MINIMO. Las librerías sí compilan en 26.0.1 — eso lo comprueba el job
  # `minimo-soportado`, y es lo que el contrato promete a quien consume.
  #
  # Al subirla, rehacer la medición: puede que la causa haya desaparecido y baje.
  tests-minimo-ejecutable:
    name: Tests en el mínimo ejecutable — Xcode 26.2 (${{ matrix.package }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [AppFoundation, CoreNetworking]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_TESTS_MINIMO }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Build estricto (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build --build-tests

      - name: swift test (macOS)
        run: swift test --parallel

  # Aviso temprano del toolchain con el que se DESARROLLA (Swift 6.4 / Xcode 27). Existe
  # porque el desfase entre desarrollo y CI ya costó caro: el 2026-09-16 se publicaron dos
  # versiones con el CI en rojo y tres rondas para cerrarlo, porque los diagnósticos que
  # emite 6.2.4 no los emite 6.4 y no hay forma local de verlos.
  #
  # NO bloquea, y es deliberado: `xcode-27` es una imagen en PREVIEW y trae una beta
  # (27.0 beta 6, 27A5252f). Una imagen en preview no puede decidir si se publica o no.
  #
  # CONDICIÓN PARA VOLVERLO BLOQUEANTE: cuando `xcode-27` salga de preview y su Xcode sea
  # estable. Seguimiento: https://github.com/actions/runner-images/issues/14404
  aviso-toolchain-desarrollo:
    name: Aviso temprano — Xcode 27 beta (${{ matrix.package }})
    runs-on: xcode-27
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: [AppFoundation, CoreNetworking]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Build estricto (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build --build-tests

      - name: swift test (macOS)
        run: swift test --parallel
