# CI de spm-pro: dos paquetes + los cuatro ejemplos del kit de arquitectura, un workflow.
#
# - `lint`: swift-format del toolchain, configuración en `.swift-format` (raíz), en modo
#   `--strict` y bloqueante. X-01 lo dejó con `continue-on-error` y sin `--strict` porque
#   la oleada 1 corría seis agentes en paralelo tocando Sources/Tests a la vez; X-02, con
#   todo mergeado y `swift format lint --strict` en 0 avisos, endurece el job.
# - `test`: matriz por paquete. Tres capas, de más barata a más cara:
#     1. `SWIFT_STRICT_WARNINGS=1 swift build --build-tests` — nivel 0 de warnings
#        (el gate vive en cada Package.swift; sin la variable el consumidor no lo hereda).
#     2. `swift test --parallel` en macOS (host).
#     3. `xcodebuild test` en iOS Simulator, con el simulador que exista en el runner
#        (detectado en un paso previo; los nombres cambian con cada Xcode).
# - `example`: matriz por ejemplo, uno por variante del kit de arquitectura (PRD-AF-07) —
#   `AppFoundation/Examples/{CounterApp,NotesApp,LoginApp,CatalogApp}` — cada uno la prueba
#   de que ambos paquetes (o solo AppFoundation, en CounterApp/NotesApp) se adoptan sin
#   fricción. Solo macOS/`swift test`: ninguno expone un producto de app, así que no hay
#   scheme de `xcodebuild test` que ejecutar. Sustituye al job único de
#   `Examples/IntegrationExample` (movido con `git mv` a `AppFoundation/Examples/LoginApp`).
# - `generator`: `Scripts/verify-generator.sh` reproduce la verificación real del
#   generador/linter en un paquete temporal FUERA del repo: las cuatro variantes de
#   `generate-feature` compilan y sus tests pasan, `ArchitectureLint` (build-tool plugin)
#   pasa limpio, una violación de R1 hace fallar el build con `[ArchLint.R1]`, y
#   `swift package archlint` pasa limpio sobre los cuatro ejemplos (son la referencia).
# - `corenetworking-example`: `CoreNetworking/Examples/APIClientApp`, el consumidor mínimo
#   sin AppFoundation — la prueba de que CoreNetworking se adopta solo.
# - `docs`: primero `Scripts/check-doc-snippets.sh` (los bloques ```swift en línea de
#   `Documentation.docc/`, marcados `<!-- snippet: <name> -->`, deben coincidir con
#   `Snippets/` — PRD-X-04: `@Snippet(path:)` no se resuelve en el primer `xcodebuild
#   docbuild` sobre DerivedData limpio), luego `xcodebuild docbuild` para los dos schemes
#   (`AppFoundation`, `CoreNetworking-Package`) en iOS Simulator y macOS — falla si DocC no
#   puede construir el catálogo (`Documentation.docc/`) o si hay avisos (enlaces
#   `<doc:...>` rotos, parámetros sin documentar).
# - `snippets`: `swift build` en cada paquete compila `Snippets/` junto con Sources/Tests
#   (SwiftPM los descubre como productos ejecutables automáticamente) — job explícito y
#   rápido para que un snippet roto falle solo, sin esperar a la matriz completa de `test`.
# - `dedup-check`: `Scripts/dedup-check.sh`. `check-doc-snippets.sh` y `verify-generator.sh`
#   existen por triplicado/duplicado (Scripts/, AppFoundation/Scripts/, CoreNetworking/
#   Scripts/) porque cada paquete necesita su propia copia real para sobrevivir al `subtree
#   split` que lo publica — un symlink no serviría. Este job falla si una copia que debe
#   coincidir con otra diverge en silencio (ya pasó con `verify-generator.sh`). Solo aquí,
#   no en el CI de cada paquete publicado: ese no ve las copias hermanas de los otros
#   paquetes, así que no podría comparar nada.
# - `archlint-self`: `archlint` sobre `Sources/AppFoundation` y `Snippets/`, con la
#   configuración de `AppFoundation/.archlint.yml` (que desactiva R1-R15 y deja SOLO R16).
#   Las reglas de capas describen la arquitectura de una app consumidora y no aplican al
#   paquete que define esas primitivas — sobre las fuentes propias dan diez falsos positivos
#   por construcción. R16 sí aplica igual: toda `class` no `nonisolated` necesita un `deinit
#   {}` explícito, porque sin él el compilador sintetiza uno AISLADO que pasa por el shim de
#   back-deploy que abortó en iOS 26.2. Hasta 1.2.4 nada lintaba las fuentes propias y se
#   habían colado dos: `PopGestureEnabler.ViewController` y `ResourceBundle.Finder`, más
#   cuatro en `Snippets/` (código que el consumidor copia de la documentación).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Swift 6.2 (tools) exige Xcode 26.x; `latest-stable` lo garantiza en la imagen macos-15.
  XCODE_VERSION: latest-stable

jobs:
  lint:
    name: swift format lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version
          swift format --version

      - name: swift format lint --strict
        run: |
          swift format lint --strict --recursive \
            AppFoundation/Sources AppFoundation/Tests AppFoundation/Examples AppFoundation/Plugins AppFoundation/Snippets \
            CoreNetworking/Sources CoreNetworking/Tests CoreNetworking/Examples CoreNetworking/Snippets

  test:
    name: ${{ matrix.package }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: AppFoundation
            scheme: AppFoundation
          - package: CoreNetworking
            # Con dos productos SPM no genera un scheme `CoreNetworking` con acción de
            # test: el agregado es `CoreNetworking-Package` (ver README del paquete).
            scheme: CoreNetworking-Package
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Detectar simulador iOS disponible
        id: sim
        run: |
          # iPhone disponible del runtime iOS más reciente, prefiriendo el modelo base
          # ("iPhone 17" antes que "iPhone 17 Pro Max"). Se exporta el nombre, no el
          # UDID, para que el log de xcodebuild sea legible.
          name=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(rt for rt in devices if "iOS" in rt)
          for rt in reversed(runtimes):
              iphones = sorted((d["name"] for d in devices[rt] if d["name"].startswith("iPhone")), key=len)
              if iphones:
                  print(iphones[0]); break
          ')
          if [ -z "$name" ]; then
            echo "::error::No hay ningún iPhone disponible en el runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulador: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Cache de .build
        uses: actions/cache@v4
        with:
          path: ${{ matrix.package }}/.build
          key: spm-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles(format('{0}/Package.swift', matrix.package)) }}
          restore-keys: |
            spm-${{ matrix.package }}-${{ runner.os }}-

      - name: Build estricto (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build --build-tests

      - name: swift test (macOS)
        run: swift test --parallel

      - name: xcodebuild test (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "${{ matrix.scheme }}" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath "TestResults-${{ matrix.package }}.xcresult" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee "xcodebuild-${{ matrix.package }}.log"

      - name: Subir resultados si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.package }}
          path: |
            ${{ matrix.package }}/TestResults-${{ matrix.package }}.xcresult
            ${{ matrix.package }}/xcodebuild-${{ matrix.package }}.log
          if-no-files-found: ignore

  example:
    name: Examples/${{ matrix.example }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        example: [CounterApp, NotesApp, LoginApp, CatalogApp]
    defaults:
      run:
        working-directory: AppFoundation/Examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Cache de .build
        uses: actions/cache@v4
        with:
          path: AppFoundation/Examples/${{ matrix.example }}/.build
          key: spm-${{ matrix.example }}-${{ runner.os }}-${{ hashFiles(format('AppFoundation/Examples/{0}/Package.swift', matrix.example), 'AppFoundation/Package.swift', 'CoreNetworking/Package.swift') }}
          restore-keys: |
            spm-${{ matrix.example }}-${{ runner.os }}-

      - name: Build estricto (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build --build-tests

      - name: swift test (macOS)
        run: swift test --parallel

  generator:
    name: generate-feature + ArchitectureLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Scripts/verify-generator.sh
        run: Scripts/verify-generator.sh

  corenetworking-example:
    name: Examples/APIClientApp
    runs-on: macos-15
    defaults:
      run:
        working-directory: CoreNetworking/Examples/APIClientApp
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Versiones
        run: |
          xcodebuild -version
          swift --version

      - name: Cache de .build
        uses: actions/cache@v4
        with:
          path: CoreNetworking/Examples/APIClientApp/.build
          key: spm-APIClientApp-${{ runner.os }}-${{ hashFiles('CoreNetworking/Examples/APIClientApp/Package.swift', 'CoreNetworking/Package.swift') }}
          restore-keys: |
            spm-APIClientApp-${{ runner.os }}-

      - name: Build estricto (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build --build-tests

      - name: swift test (macOS)
        run: swift test --parallel

  docs:
    name: docbuild (${{ matrix.scheme }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: AppFoundation
            scheme: AppFoundation
          - package: CoreNetworking
            scheme: CoreNetworking-Package
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Scripts/check-doc-snippets.sh
        working-directory: ${{ github.workspace }}
        run: Scripts/check-doc-snippets.sh

      - name: xcodebuild docbuild (DerivedData limpio, 0 warnings)
        run: |
          set -o pipefail
          for destination in 'generic/platform=iOS Simulator' 'platform=macOS'; do
            echo "::group::docbuild -scheme ${{ matrix.scheme }} -destination $destination"
            log="$(mktemp)"
            xcodebuild docbuild \
              -scheme "${{ matrix.scheme }}" \
              -destination "$destination" \
              -derivedDataPath "$(mktemp -d)" \
              | tee "$log"
            echo "::endgroup::"
            if grep -q "warning:" "$log"; then
              echo "::error::docbuild (-destination $destination) produjo warnings"
              exit 1
            fi
          done

  snippets:
    name: Snippets/ (${{ matrix.package }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [AppFoundation, CoreNetworking]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: swift build (compila Sources/Tests y Snippets/)
        run: swift build

  dedup-check:
    name: Scripts duplicados entre paquetes siguen sincronizados
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Scripts/dedup-check.sh
        run: Scripts/dedup-check.sh

  archlint-self:
    name: archlint (R16) sobre las fuentes de AppFoundation
    runs-on: macos-15
    defaults:
      run:
        working-directory: AppFoundation
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Construir archlint
        run: swift build --product archlint

      - name: archlint sobre Sources/ y Snippets/
        run: .build/debug/archlint --root . Sources/AppFoundation Snippets
