# kit.conf — el ÚNICO fichero que el kit necesita de este proyecto.
#
# spm-pro es un monorepo de DOS paquetes SwiftPM que se publican por `git subtree split`
# a sus propios repositorios. No hay app de Xcode: todo lo que se verifica es SwiftPM.

# Dónde buscar lógica repetida. Solo las fuentes de producción: Examples/ y Snippets/
# repiten código A PROPÓSITO (son escaparate y documentación ejecutable), y contarlos
# convertiría el detector en ruido.
FUENTES="AppFoundation/Sources CoreNetworking/Sources"

# Qué hay que ejecutar para dar el proyecto por verificado. Los tiempos son los medidos
# el 2026-09-15 en caliente, y son la razón de que el corte esté donde está: la puerta
# entera cuesta ~15 s, así que nadie tiene motivo para saltársela.
verificaciones() {
    # Formato: 2 s, y caza lo que ningún test ve (orden de imports, largo de línea).
    paso "formato · lint estricto" bash -c '
        swift format lint --strict --recursive \
            AppFoundation/Sources AppFoundation/Tests AppFoundation/Examples \
            AppFoundation/Plugins AppFoundation/Snippets \
            CoreNetworking/Sources CoreNetworking/Tests CoreNetworking/Examples \
            CoreNetworking/Snippets'

    # Build y tests ENCADENADOS con && en un solo paso, a propósito: separados, un build
    # rojo dejaría a los tests corriendo contra el bundle anterior y estampando un ✅
    # sobre artefactos viejos.
    paso "AppFoundation · build + tests" bash -c '
        cd AppFoundation && SWIFT_STRICT_WARNINGS=1 swift build --build-tests && swift test --parallel'
    paso "CoreNetworking · build + tests" bash -c '
        cd CoreNetworking && SWIFT_STRICT_WARNINGS=1 swift build --build-tests && swift test --parallel'

    # Las reglas de arquitectura sobre las propias fuentes (1 s) y el contrato de ciclo
    # de vida de SwiftUI (3 s).
    paso "archlint · R1-R16 sobre AppFoundation" bash -c '
        cd AppFoundation && swift build --product archlint && .build/debug/archlint --root . Sources/AppFoundation Snippets'
    paso "contrato de ciclo de vida" bash -c 'cd AppFoundation && Scripts/verify-lifecycle-contract.sh'

    # La documentación ejecutable: que los bloques en línea sigan coincidiendo con Snippets/.
    paso "snippets · los dos paquetes" bash -c '
        cd AppFoundation && Scripts/check-doc-snippets.sh && cd ../CoreNetworking && Scripts/check-doc-snippets.sh'

    # Los scripts duplicados entre la raíz y AppFoundation/, que tienen que ir sincronizados.
    paso "scripts duplicados sincronizados" bash -c 'Scripts/dedup-check.sh'

    # LÍMITES DE ESTA FIRMA — declarados porque estrecharlos en silencio sería peor:
    #
    #   - El CI corre con Xcode 26.3 (Swift 6.2.4) y esta máquina con Xcode 27 (Swift 6.4).
    #     Lo que se firma aquí NO prueba que compile con 6.2.4. Medido el 2026-09-15: un
    #     `public import` sin uso en `LifecycleContractProbeApp` pasaba en 6.4 y era error
    #     en 6.2.4. Esa comprobación solo la da el CI.
    #   - `Scripts/verify-generator.sh` (74 s) queda fuera: verifica el generador entero
    #     —cuatro variantes, modo multi, ArchitectureLint y archlint sobre los ejemplos—.
    #     Si tocas `Templates/`, `Plugins/` o `Scripts/verify-generator.sh`, córrelo a mano
    #     antes de commitear: esta firma no lo cubre.
    #   - Fuera también, y solo en CI: `xcodebuild test` en simulador iOS, `docbuild` de
    #     ambos esquemas, los cinco paquetes de `Examples/` y `verify-multi.sh`.
}
